<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công Cụ Trích Xuất Metadata Ảnh (EXIF Viewer)</title>
    
    <!-- Thư viện hiển thị Bản đồ (Leaflet CSS & JS) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Thư viện đọc đầy đủ dữ liệu EXIF -->
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { max-width: 900px; margin: 30px auto; padding: 0 15px; background: #f0f2f5; color: #333; }
        .card { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { margin-top: 0; color: #1a73e8; text-align: center; }
        
        .upload-area { 
            border: 2px dashed #1a73e8; padding: 30px; text-align: center; 
            border-radius: 10px; background: #e8f0fe; cursor: pointer; transition: 0.3s;
        }
        .upload-area:hover { background: #d2e3fc; }
        
        .content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        @media (max-width: 768px) { .content-grid { grid-template-columns: 1fr; } }
        
        #preview { max-width: 100%; border-radius: 8px; display: none; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        
        .table-container { max-height: 400px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; position: sticky; top: 0; color: #555; }
        tr:hover { background: #f1f3f4; }

        #map { height: 300px; width: 100%; border-radius: 8px; margin-top: 20px; display: none; }
        .status-msg { margin-top: 15px; padding: 12px; border-radius: 6px; font-weight: 500; text-align: center; }
        .info { background: #e3f2fd; color: #0d47a1; }
        .warning { background: #fff3e0; color: #e65100; }
    </style>
</head>
<body>

<div class="card">
    <h2>Trích Xuất Metadata & EXIF Dữ Liệu Ảnh</h2>
    
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <p style="margin:0; font-size: 16px; font-weight: bold; color: #1a73e8;">Nhấp hoặc Kéo thả ảnh gốc vào đây (JPG / JPEG / HEIC)</p>
        <small style="color: #666;">(Ảnh tải qua Zalo, Facebook, Messenger sẽ bị nền tảng tự động xóa Metadata)</small>
    </div>
    
    <input type="file" id="fileInput" accept="image/jpeg, image/jpg" style="display: none;">

    <div id="status" class="status-msg info" style="display: none;"></div>

    <div class="content-grid">
        <div>
            <img id="preview" alt="Xem trước ảnh">
            <div id="map"></div>
        </div>
        
        <div>
            <h3 style="margin-top: 0; font-size: 16px; color: #444;">Chi Tiết Bảng Metadata:</h3>
            <div class="table-container">
                <table id="metadataTable">
                    <thead>
                        <tr>
                            <th>Thông Số (Tag)</th>
                            <th>Giá Trị (Value)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="2" style="text-align: center; color: #888;">Chưa có dữ liệu</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    let map = null;
    let marker = null;

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        // 1. Hiển thị ảnh xem trước
        const preview = document.getElementById('preview');
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';

        const status = document.getElementById('status');
        status.style.display = 'block';
        status.className = 'status-msg info';
        status.innerHTML = 'Đang đọc dữ liệu Metadata...';

        // 2. Đọc tất cả thông số EXIF bằng exif-js
        EXIF.getData(file, function() {
            const allMetaData = EXIF.getAllTags(this);
            const tbody = document.querySelector('#metadataTable tbody');
            tbody.innerHTML = ''; // Xóa bảng cũ

            if (Object.keys(allMetaData).length === 0) {
                status.className = 'status-msg warning';
                status.innerHTML = 'Bức ảnh này không chứa thông tin EXIF Metadata!';
                tbody.innerHTML = '<tr><td colspan="2" style="text-align: center;">Không tìm thấy dữ liệu</td></tr>';
                document.getElementById('map').style.display = 'none';
                return;
            }

            status.innerHTML = `Đã trích xuất thành công ${Object.keys(allMetaData).length} thông số Metadata!`;

            // 3. Đổ toàn bộ dữ liệu ra bảng
            for (let tag in allMetaData) {
                if (tag === 'thumbnail') continue; // Bỏ qua dữ liệu ảnh thu nhỏ dạng nhị phân
                
                let value = allMetaData[tag];
                
                // Chuẩn hóa hiển thị giá trị
                if (typeof value === 'object' && value !== null) {
                    value = JSON.stringify(value);
                }

                const row = `<tr>
                    <td><strong>${tag}</strong></td>
                    <td>${value}</td>
                </tr>`;
                tbody.innerHTML += row;
            }

            // 4. Trích xuất Tọa độ GPS nếu có
            const lat = EXIF.getTag(this, "GPSLatitude");
            const latRef = EXIF.getTag(this, "GPSLatitudeRef");
            const lon = EXIF.getTag(this, "GPSLongitude");
            const lonRef = EXIF.getTag(this, "GPSLongitudeRef");

            if (lat && lon && latRef && lonRef) {
                const latitude = convertDMSToDD(lat[0], lat[1], lat[2], latRef);
                const longitude = convertDMSToDD(lon[0], lon[1], lon[2], lonRef);
                
                document.getElementById('map').style.display = 'block';
                showLocationOnMap(latitude, longitude);
            } else {
                document.getElementById('map').style.display = 'none';
            }
        });
    });

    // Chuyển đổi tọa độ GPS từ Độ/Phút/Giây sang dạng thập phân
    function convertDMSToDD(degrees, minutes, seconds, direction) {
        let dd = Number(degrees) + (Number(minutes) / 60) + (Number(seconds) / 3600);
        if (direction === "S" || direction === "W") dd = dd * -1;
        return dd;
    }

    // Hiển thị bản đồ Leaflet
    function showLocationOnMap(lat, lng) {
        if (!map) {
            map = L.map('map').setView([lat, lng], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        } else {
            map.setView([lat, lng], 15);
        }

        if (marker) map.removeLayer(marker);
        marker = L.marker([lat, lng]).addTo(map).bindPopup('Vị trí chụp ảnh').openPopup();
        setTimeout(() => { map.invalidateSize(); }, 200);
    }
</script>

</body>
</html>
