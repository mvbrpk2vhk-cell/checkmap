<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công Cụ Trích Xuất Dữ Liệu Ảnh (EXIF Viewer)</title>
    
    <!-- Thư viện hiển thị Bản đồ (Leaflet CSS & JS) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Thư viện đọc dữ liệu EXIF -->
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { max-width: 900px; margin: 20px auto; padding: 0 15px; background: #f0f2f5; color: #333; }
        .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { margin-top: 0; margin-bottom: 15px; color: #1a73e8; text-align: center; }
        
        .upload-area { 
            border: 2px dashed #1a73e8; padding: 20px; text-align: center; 
            border-radius: 10px; background: #e8f0fe; cursor: pointer; transition: 0.3s;
        }
        .upload-area:hover { background: #d2e3fc; }
        
        /* Cấu trúc linh hoạt, tự động thu gọn khoảng trắng */
        .content-container { display: flex; flex-direction: column; gap: 15px; margin-top: 15px; }
        
        .media-box { display: flex; flex-direction: column; gap: 15px; }
        #preview { max-width: 100%; max-height: 350px; object-fit: contain; border-radius: 8px; display: none; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        #map { height: 280px; width: 100%; border-radius: 8px; display: none; }

        .table-container { max-height: 350px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; display: none; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; position: sticky; top: 0; color: #555; }
        tr:hover { background: #f1f3f4; }

        .status-msg { margin-top: 15px; padding: 10px 15px; border-radius: 6px; font-weight: 500; text-align: center; display: none; }
        .info { background: #e3f2fd; color: #0d47a1; }
        .warning { background: #fff3e0; color: #e65100; }

        /* Màn hình rộng sẽ chia 2 cột gọn gàng */
        @media (min-width: 768px) {
            .content-container { display: grid; grid-template-columns: 1fr 1fr; align-items: start; }
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Trích Xuất Thông Tin Dữ Liệu Ảnh</h2>
    
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <p style="margin:0; font-size: 15px; font-weight: bold; color: #1a73e8;">Nhấp hoặc Kéo thả ảnh gốc vào đây (JPG / JPEG)</p>
        <small style="color: #666;">(Lưu ý: Ảnh gửi qua Zalo, Facebook, Messenger sẽ bị xóa hết dữ liệu)</small>
    </div>
    
    <input type="file" id="fileInput" accept="image/jpeg, image/jpg" style="display: none;">

    <div id="status" class="status-msg info"></div>

    <div class="content-container">
        <!-- Cột trái: Ảnh và Bản đồ -->
        <div class="media-box">
            <img id="preview" alt="Xem trước ảnh">
            <div id="map"></div>
        </div>
        
        <!-- Cột phải: Bảng thông tin tiếng Việt -->
        <div id="tableWrapper" class="table-container">
            <table id="metadataTable">
                <thead>
                    <tr>
                        <th>Thông Số</th>
                        <th>Giá Trị</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let map = null;
    let marker = null;

    // Bộ từ điển dịch thông số EXIF tiếng Anh -> Tiếng Việt
    const exifDictionary = {
        "Make": "Hãng sản xuất",
        "Model": "Tên thiết bị (Model)",
        "Software": "Phần mềm / Hệ điều hành",
        "DateTimeOriginal": "Thời gian bấm máy",
        "DateTimeDigitized": "Thời gian số hóa",
        "DateTime": "Thời gian cập nhật tệp",
        "ExposureTime": "Tốc độ màn hình (Giây)",
        "FNumber": "Khẩu độ (f/)",
        "ISOSpeedRatings": "Độ nhạy sáng (ISO)",
        "FocalLength": "Tiêu cự ống kính (mm)",
        "FocalLengthIn35mmFilm": "Tiêu cự quy đổi 35mm",
        "Flash": "Đèn Flash",
        "WhiteBalance": "Cân bằng trắng",
        "MeteringMode": "Chế độ đo sáng",
        "ExposureProgram": "Chế độ chụp",
        "PixelXDimension": "Chiều rộng (Pixels)",
        "PixelYDimension": "Chiều cao (Pixels)",
        "Orientation": "Hướng xoay ảnh",
        "GPSLatitude": "Vĩ độ GPS",
        "GPSLongitude": "Kinh độ GPS",
        "GPSAltitude": "Độ cao so với mực nước biển (m)",
        "GPSTimeStamp": "Giờ GPS (UTC)",
        "GPSDateStamp": "Ngày GPS",
        "SceneCaptureType": "Bối cảnh chụp",
        "SensingMethod": "Cảm biến ảnh",
        "ExifVersion": "Phiên bản EXIF"
    };

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        // 1. Xem trước ảnh
        const preview = document.getElementById('preview');
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';

        const status = document.getElementById('status');
        const tableWrapper = document.getElementById('tableWrapper');
        status.style.display = 'block';
        status.className = 'status-msg info';
        status.innerHTML = 'Đang phân tích thông tin dữ liệu...';

        // 2. Đọc dữ liệu EXIF
        EXIF.getData(file, function() {
            const allMetaData = EXIF.getAllTags(this);
            const tbody = document.querySelector('#metadataTable tbody');
            tbody.innerHTML = '';

            if (Object.keys(allMetaData).length === 0) {
                status.className = 'status-msg warning';
                status.innerHTML = 'Bức ảnh này không chứa dữ liệu ẩn (EXIF)!';
                tableWrapper.style.display = 'none';
                document.getElementById('map').style.display = 'none';
                return;
            }

            status.innerHTML = `Đã tìm thấy thông tin ảnh thành công!`;
            tableWrapper.style.display = 'block';

            // 3. Đổ dữ liệu đã dịch ra bảng
            for (let tag in allMetaData) {
                if (tag === 'thumbnail' || tag === 'MakerNote') continue; // Bỏ qua dữ liệu thô
                
                // Lấy tên Tiếng Việt nếu có trong từ điển, nếu không giữ tên gốc
                let labelVN = exifDictionary[tag] || tag;
                let value = allMetaData[tag];

                // Làm đẹp giá trị hiển thị
                if (tag === 'Flash') {
                    value = (value == 0 || value == 16) ? "Tắt" : "Bật/Đã đánh đèn";
                } else if (tag === 'WhiteBalance') {
                    value = (value == 0) ? "Tự động (Auto)" : "Thủ công (Manual)";
                } else if (typeof value === 'object' && value !== null) {
                    value = JSON.stringify(value);
                }

                const row = `<tr>
                    <td><strong>${labelVN}</strong></td>
                    <td>${value}</td>
                </tr>`;
                tbody.innerHTML += row;
            }

            // 4. Định vị Bản đồ
            const lat = EXIF.getTag(this, "GPSLatitude");
            const latRef = EXIF.getTag(this, "GPSLatitudeRef");
            const lon = EXIF.getTag(this, "GPSLongitude");
            const lonRef = EXIF.getTag(this, "GPSLongitudeRef");

            if (lat && lon && latRef && lonRef) {
                const latitude = convertDMSToDD(lat[0], lat[1], lat[2], latRef);
                const longitude = convertDMSToDD(lon[0], lon[1], lon[2], lonRef);
                
                document.getElementById('map').style.display = 'block';
                showLocationOnMap(latitude, longitude);
            } else {
                document.getElementById('map').style.display = 'none';
            }
        });
    });

    function convertDMSToDD(degrees, minutes, seconds, direction) {
        let dd = Number(degrees) + (Number(minutes) / 60) + (Number(seconds) / 3600);
        if (direction === "S" || direction === "W") dd = dd * -1;
        return dd;
    }

    function showLocationOnMap(lat, lng) {
        if (!map) {
            map = L.map('map').setView([lat, lng], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        } else {
            map.setView([lat, lng], 15);
        }

        if (marker) map.removeLayer(marker);
        marker = L.marker([lat, lng]).addTo(map).bindPopup('Vị trí chụp ảnh').openPopup();
        setTimeout(() => { map.invalidateSize(); }, 200);
    }
</script>

</body>
</html>
